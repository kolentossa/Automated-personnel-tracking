server:
  host: 0.0.0.0
  port: 8000

camera:
  source_type: camera
  camera_device: /dev/video11
  capture_backend: gstreamer
  auto_detect: true
  width: 1280
  height: 720
  fps: 30
  retry_interval_sec: 3.0
  gstreamer_pipeline: "v4l2src device={device} ! video/x-raw,format=NV12,width={width},height={height} ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true max-buffers=1 sync=false"
  video_file: data/sample.mp4
  rtsp_url: ""

detector:
  type: rknn-yolo
  model_path: models/yolov8n.rknn
  model_family: yolov8
  input_size: 640
  confidence_threshold: 0.35
  class_confidence_thresholds: {"person": 0.35, "cell phone": 0.35, "bottle": 0.22, "fork": 0.22, "knife": 0.22, "spoon": 0.22, "remote": 0.22, "scissors": 0.22, "toothbrush": 0.22}
  nms_threshold: 0.45
  class_filter: ["person", "cell phone", "bottle", "fork", "knife", "spoon", "remote", "scissors", "toothbrush"]
  phone_roi_refinement:
    enabled: true
    confidence_threshold: 0.12
    refine_below_confidence: 0.30
    detect_every_n_primary_frames: 1
    max_people: 1
    min_person_height_px: 160
    horizontal_expansion_ratio: 0.20
    top_expansion_ratio: 0.04
    upper_body_ratio: 0.90
    crop_modes: [{"name":"head_shoulders","detector":"primary","confidence_threshold":0.12,"top_ratio":0.00,"bottom_ratio":0.52,"horizontal_expansion_ratio":0.28,"top_expansion_ratio":0.06},{"name":"hands_torso","detector":"primary","confidence_threshold":0.20,"top_ratio":0.18,"bottom_ratio":0.88,"horizontal_expansion_ratio":0.22,"top_expansion_ratio":0.00},{"name":"upper_body_context","detector":"context","confidence_threshold":0.35,"top_ratio":0.00,"bottom_ratio":0.90,"horizontal_expansion_ratio":0.20,"top_expansion_ratio":0.04}]
    cache_primary_frames: 8
    cache_confidence_decay: 0.97
    cache_min_confidence: 0.08
    max_phone_area_ratio: 0.25
    nms_threshold: 0.35
    containment_threshold: 0.70
    context_model:
      enabled: true
      model_path: models/yolo11n.rknn
      model_family: yolo11
      input_size: 640
      confidence_threshold: 0.35
      nms_threshold: 0.45
      class_filter: ["cell phone"]
      core_mask: "0_1_2"
      expected_sha256: 8853507c88c777f39e574b730abdd2a151be102830c570cee0fd31a6bb8010fc
  core_mask: "0_1_2"
  expected_sha256: ff3a64e6fe180203128c8d42456b458d208d3a1e2217d63683af00d6194e82ea
  fallback_to_cpu: false

detection:
  model_path: models/MobileNetSSD_deploy.caffemodel
  model_config_path: models/MobileNetSSD_deploy.prototxt
  confidence_threshold: 0.45
  input_size: 300
  nms_threshold: 0.45
  motion_min_area: 500
  allow_motion_fallback: false

performance:
  target_fps: 30
  target_latency_ms: 30
  latest_frame_only: true
  queue_size: 1
  detect_every_n_frames: 3
  cpu_affinity: "4-7"
  timing_window_frames: 30
  memory_trim_every_n_frames: 300

stream:
  jpeg_quality: 74
  width: 800
  height: 450

tracking:
  iou_threshold: 0.3
  max_missing: 20
  min_confidence: 0.15

counting:
  line:
    x1: 814.899
    y1: 309.778
    x2: 789.76
    y2: 710.595
  direction:
    mode: right_to_left
  cooldown_frames: 20
privacy:
  face_detection_enabled: false
  mosaic_enabled: false
  unredacted_video_enabled: true
  unredacted_evidence_enabled: true
