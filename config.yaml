server:
  host: 0.0.0.0
  port: 8000

camera:
  source_type: camera
  camera_device: /dev/video11
  capture_backend: gstreamer
  auto_detect: true
  width: 1280
  height: 720
  fps: 30
  retry_interval_sec: 3.0
  gstreamer_pipeline: "v4l2src device={device} ! video/x-raw,format=NV12,width={width},height={height} ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true max-buffers=1 sync=false"
  video_file: data/sample.mp4
  rtsp_url: ""

detector:
  type: rknn-yolo
  model_path: models/yolov8n.rknn
  model_family: yolov8
  input_size: 640
  confidence_threshold: 0.35
  nms_threshold: 0.45
  class_filter: ["person", "cell phone"]
  core_mask: "0_1_2"
  expected_sha256: ff3a64e6fe180203128c8d42456b458d208d3a1e2217d63683af00d6194e82ea
  fallback_to_cpu: false

detection:
  model_path: models/MobileNetSSD_deploy.caffemodel
  model_config_path: models/MobileNetSSD_deploy.prototxt
  confidence_threshold: 0.45
  input_size: 300
  nms_threshold: 0.45
  motion_min_area: 500
  allow_motion_fallback: false

performance:
  target_fps: 30
  target_latency_ms: 30
  latest_frame_only: true
  queue_size: 1
  detect_every_n_frames: 3
  cpu_affinity: "4-7"
  timing_window_frames: 30
  memory_trim_every_n_frames: 300

stream:
  jpeg_quality: 74
  width: 800
  height: 450

tracking:
  iou_threshold: 0.3
  max_missing: 20
  min_confidence: 0.15

counting:
  line:
    x1: 640
    y1: 0
    x2: 640
    y2: 720
  direction:
    mode: left_to_right
  cooldown_frames: 20
privacy:
  face_mosaic_enabled: true
  face_detector: retinaface-onnx
  face_model_path: models/RetinaFace_mobile320.onnx
  face_input_size: 320
  face_confidence_threshold: 0.6
  face_nms_threshold: 0.4
  face_detector_threads: 1
  face_detect_every_n_frames: 5
  face_result_max_age_ms: 1000
  face_mosaic_padding: 0.25
  face_tracking_enabled: true
  face_tracking_min_points: 4
  face_tracking_win_size: 31
  face_tracking_max_level: 3
  face_tracking_max_motion_px: 96
  head_fallback_enabled: true
  mosaic_strength: 14
