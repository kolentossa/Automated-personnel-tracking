server:
  host: 0.0.0.0
  port: 8000

camera:
  source_type: camera
  camera_device: /dev/video11
  capture_backend: gstreamer
  auto_detect: true
  width: 1280
  height: 720
  fps: 30
  retry_interval_sec: 3.0
  gstreamer_pipeline: "v4l2src device={device} ! video/x-raw,format=NV12,width={width},height={height} ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true max-buffers=1 sync=false"
  video_file: data/sample.mp4

detector:
  type: rknn-yolo
  model_path: models/yolov8n.rknn
  model_family: yolov8
  input_size: 640
  confidence_threshold: 0.35
  nms_threshold: 0.45
  class_filter: ["person"]
  fallback_to_cpu: false

detection:
  model_path: models/MobileNetSSD_deploy.caffemodel
  model_config_path: models/MobileNetSSD_deploy.prototxt
  confidence_threshold: 0.45
  input_size: 300
  nms_threshold: 0.45
  motion_min_area: 500
  allow_motion_fallback: false

performance:
  target_fps: 30
  target_latency_ms: 30
  latest_frame_only: true
  queue_size: 1
  detect_every_n_frames: 1

stream:
  jpeg_quality: 80
  width: 960
  height: 540

tracking:
  iou_threshold: 0.3
  max_missing: 20
  min_confidence: 0.15

counting:
  line:
    x1: 640
    y1: 0
    x2: 640
    y2: 720
  direction:
    mode: left_to_right
  cooldown_frames: 20
privacy:
  face_mosaic_enabled: true
  head_fallback_enabled: true
  mosaic_strength: 14
