<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RK3588 Personnel Tracking</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>RK3588 Personnel Tracking</h1>
          <p id="service-state">Connecting</p>
        </div>
        <div class="status-pill" id="camera-pill">Offline</div>
      </header>

      <section class="layout">
        <section class="video-panel" aria-label="Live camera stream">
          <img id="video-stream" src="/video" alt="Live anonymised camera stream" />
        </section>

        <aside class="stats-panel" aria-label="Tracking statistics">
          <div class="metrics">
            <article class="metric primary"><span>Current occupancy</span><strong id="current-occupancy">0</strong></article>
            <article class="metric"><span>Total entered</span><strong id="total-entered">0</strong></article>
            <article class="metric"><span>Total exited</span><strong id="total-exited">0</strong></article>
            <article class="metric"><span>Active tracks</span><strong id="active-tracks">0</strong></article>
            <article class="metric"><span>FPS</span><strong id="fps">0</strong></article>
            <article class="metric"><span>Total latency</span><strong><span id="total-latency-ms">0</span><small> ms</small></strong></article>
            <article class="metric"><span>Inference</span><strong><span id="inference-ms">0</span><small> ms</small></strong></article>
          </div>

          <dl class="details">
            <div><dt>Camera status</dt><dd id="camera-status">offline</dd></div>
            <div><dt>Source</dt><dd id="source">-</dd></div>
            <div><dt>Detector</dt><dd id="detector">-</dd></div>
            <div><dt>NPU</dt><dd id="npu-enabled">-</dd></div>
            <div><dt>Privacy</dt><dd id="privacy">ON</dd></div>
          </dl>

          <button id="reset-button" type="button">Reset stats</button>

          <section class="events-section">
            <h2>Recent crossing events</h2>
            <ol id="events"></ol>
          </section>
        </aside>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
